<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ company_name }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#0d0630;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0d0630;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:560px;background-color:#141033;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);">
          <tr>
            <td style="background:linear-gradient(90deg,#00d2ff,#7b5cff);padding:22px 28px;">
              <span style="font-size:18px;font-weight:700;color:#0d0630;letter-spacing:-0.02em;">{{ company_name }}</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 28px 8px 28px;color:#e2e8f0;font-size:15px;line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px 28px 28px;color:#94a3b8;font-size:12px;line-height:1.6;border-top:1px solid rgba(255,255,255,0.08);margin-top:20px;">
              {% block footer %}
              <p style="margin:16px 0 0 0;">&copy; {{ company_name }}. All rights reserved.</p>
              {% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
