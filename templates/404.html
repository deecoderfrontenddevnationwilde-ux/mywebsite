{% extends "base.html" %}
{% block title %}Page Not Found | {{ company_name }}{% endblock %}
{% block content %}
<section class="error-page">
    <div class="container">
        <h1>404</h1>
        <p style="color:var(--muted);margin-top:1rem;">{{ message or "We couldn't find the page you were looking for." }}</p>
        <a href="{{ url_for('public.home') }}" class="btn btn-primary" style="margin-top:1.5rem;display:inline-block;">Back to Homepage</a>
    </div>
</section>
{% endblock %}
